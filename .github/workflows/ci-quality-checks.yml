name: ci-quality-checks

on:
  push:
    branches: [main, master]

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================
  # 1. JUNIT + JACOCO + ALLURE
  # ==========================================

  test:
    name: Build, Test, Jacoco and Allure
    runs-on: ubuntu-26.04

    outputs:
      allure_report: ${{ steps.generate_allure.outputs.available }}

    env:
      TZ: Asia/Almaty

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ==========================================
      # ALLURE HISTORY
      # ==========================================

      - name: Checkout Allure history
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      # ==========================================
      # JAVA
      # ==========================================

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Show Java and Maven versions
        run: |
          java -version
          mvn -v

      # ==========================================
      # JUNIT + JACOCO
      # ==========================================

      - name: Build and test
        run: mvn -B -ntp verify

      # ==========================================
      # ALLURE REPORT
      # ==========================================

      - name: Generate Allure Report
        if: always()
        run: |
          if [ -d target/allure-results ] && \
             find target/allure-results -name '*-result.json' \
             -print -quit | grep -q .; then

            echo "Allure results found."

            # Restore previous history
            if [ -d gh-pages/history ]; then
              echo "Restoring previous Allure history."

              mkdir -p target/allure-results/history

              cp -R gh-pages/history/. \
                target/allure-results/history/
            fi

            # Generate report
            mvn -B -ntp allure:report

            test -s target/site/allure-maven-plugin/index.html

            echo "available=true" >> "$GITHUB_OUTPUT"

          else
            echo "No Allure results found."

            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/
          if-no-files-found: warn
          retention-days: 14

      # ==========================================
      # JACOCO BADGES
      # ==========================================

      - name: Compile JaCoCo badge generator
        run: |
          mkdir -p target/ci-classes

          javac --release 25 \
            -d target/ci-classes \
            ci/BadgePalette.java \
            ci/JacocoBadgeGenerator.java

      - name: Generate JaCoCo badges
        run: |
          java -cp target/ci-classes ci.JacocoBadgeGenerator

      - name: Verify JaCoCo badges
        run: |
          set -e

          test -s target/site/jacoco/jacoco.xml
          test -s badges/core-coverage.svg

          for package in core logging session model stats; do
            test -s "badges/jacoco/${package}.svg"
          done

          echo "All 5 JaCoCo badges generated."

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          if-no-files-found: ignore
          path: |
            target/surefire-reports/
            target/site/jacoco/

      - name: Upload JaCoCo badges
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-badges
          if-no-files-found: error
          path: |
            badges/core-coverage.svg
            badges/jacoco/


  # ==========================================
  # 2. PIT MUTATION TESTING
  # ==========================================

  mutation:
    name: Mutation Testing
    runs-on: ubuntu-26.04

    env:
      TZ: Asia/Almaty

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run PIT
        run: |
          mvn -B -ntp -Pmutation \
            test-compile \
            org.pitest:pitest-maven:mutationCoverage

      - name: Compile PIT badge generator
        run: |
          mkdir -p target/ci-classes

          javac --release 25 \
            -d target/ci-classes \
            ci/BadgePalette.java \
            ci/PitBadgeGenerator.java

      - name: Generate PIT badges
        run: |
          java -cp target/ci-classes ci.PitBadgeGenerator

      - name: Verify PIT badges
        run: |
          set -e

          test -s target/pit-reports/mutations.xml
          test -s badges/mutation.svg

          for package in core logging session model stats; do
            test -s "badges/pit/${package}.svg"
          done

          echo "All 5 PIT badges generated."

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pit-report
          if-no-files-found: ignore
          path: target/pit-reports/

      - name: Upload PIT badges
        uses: actions/upload-artifact@v7
        with:
          name: pit-badges
          if-no-files-found: error
          path: |
            badges/mutation.svg
            badges/pit/


  # ==========================================
  # 3. PUBLISH ALL 12 BADGES
  # ==========================================

  badges:
    name: Publish QA badges
    runs-on: ubuntu-26.04

    needs:
      - test
      - mutation

    if: >
      always() &&
      needs.test.result == 'success' &&
      needs.mutation.result == 'success' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download JaCoCo badges
        uses: actions/download-artifact@v4
        with:
          name: jacoco-badges
          path: badges

      - name: Download PIT badges
        uses: actions/download-artifact@v4
        with:
          name: pit-badges
          path: badges

      - name: Verify all 12 badges
        run: |
          set -e
          
          test -s badges/core-coverage.svg
          test -s badges/mutation.svg

          for package in core logging session model stats; do
            test -s "badges/jacoco/${package}.svg"
            test -s "badges/pit/${package}.svg"
          done

          echo "All 12 badges are ready for publication."

      - name: Publish badges branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: badges
          publish_dir: badges
          force_orphan: true

  # ==========================================
  # 4. PUBLISH ALLURE REPORT
  # ==========================================

  allure-pages:
    name: Publish Allure Report
    runs-on: ubuntu-26.04

    needs:
      - test

    if: >
      always() &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: write

    concurrency:
      group: allure-pages-deployment
      cancel-in-progress: false

    steps:
      - name: Download Allure Report
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Verify Allure Report
        if: steps.download.outcome == 'success'
        run: |
          set -e
          test -s allure-report/index.html
          touch allure-report/.nojekyll
          echo "Allure report verified."

      - name: Publish Allure Report
        if: steps.download.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          force_orphan: true

      - name: Report missing artifact
        if: steps.download.outcome != 'success'
        run: |
          echo "::error::Allure report artifact was not found."
          exit 1
